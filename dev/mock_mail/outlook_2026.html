<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail - Navabi, Pouyan - Outlook</title>
<!-- The structure of an Outlook on the web row in October 2026 (outlook.cloud.microsoft), with
     sample names: the row's accessible name runs everything together, icons are font glyphs
     inside aria-hidden <i> elements, the avatar's initials sit in a role=img span, the sender
     span's tooltip holds the address, the subject span has no tooltip, the time's tooltip
     has the full date, and a read row offers "Mark as unread" while an unread one offers
     "Mark as read". -->
</head>
<body>
<div role="listbox" aria-label="Message list">
  <div id="AQAAB1" data-convid="AAQkADc9" role="option" aria-label="Collapsed Has attachments Dana Whitfield Q4 planning doc: comments by Friday please 1:47 PM Hello everyone, here is the draft">
    <div draggable="true"><div><div role="group">
      <div><button title="Mark as unread"></button></div>
      <div role="checkbox" aria-checked="false" aria-label="Select a conversation">
        <span role="img" class="fui-Avatar"><span class="fui-Avatar__initials">DW</span></span>
      </div>
      <div>
        <div><span title="dana.whitfield@example.com">Dana Whitfield</span></div>
        <div>
          <button aria-label="Mark as unread" title="Mark as unread"><span><i aria-hidden="true">&#xE73E;</i></span></button>
          <button aria-label="Flag this message" title="Flag this message"></button>
          <i aria-hidden="true">&#xE723;</i>
        </div>
        <div><div><span class="TtcXM">Q4 planning doc: comments by Friday please</span></div><span title="Thu 10/22/2026 1:47 PM">1:47 PM</span></div>
        <div><span>Hello everyone, here is the draft</span></div>
      </div>
    </div></div></div>
  </div>
  <div id="AQAAB2" data-convid="AAQkADd0" role="option" aria-label="Unread Priya Raman Re: Saturday hike, still on? 9:12 AM Are we still meeting at the trailhead at 8?">
    <div draggable="true"><div><div role="group">
      <div><button title="Mark as read"></button></div>
      <div role="checkbox" aria-checked="false" aria-label="Select a conversation">
        <span role="img" class="fui-Avatar"><span class="fui-Avatar__initials">PR</span></span>
      </div>
      <div>
        <div><span title="priya.raman@example.com">Priya Raman</span></div>
        <div>
          <button aria-label="Mark as read" title="Mark as read"></button>
          <button aria-label="Flag this message" title="Flag this message"></button>
        </div>
        <div><div><span class="TtcXM">Re: Saturday hike, still on?</span></div><span title="Thu 10/22/2026 9:12 AM">9:12 AM</span></div>
        <div><span>Are we still meeting at the trailhead at 8?</span></div>
      </div>
    </div></div></div>
  </div>
</div>
</body>
</html>
