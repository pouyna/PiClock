# PiClock settings
# After changing anything here, run:   piclock restart
# The screen refreshes itself a few seconds later.

[server]
host = 127.0.0.1
port = 8080


[display]
# yes = 14:05, no = 2:05 pm
clock_24h = no
show_seconds = no

# Dim the screen overnight (24-hour times). Leave dim_start empty to never dim.
# The new-mail chime stays silent while the screen is dimmed.
dim_start = 22:00
dim_end = 07:00
# 0 = no dimming, 0.9 = almost black
dim_amount = 0.6

# Play a soft two-note chime when new mail arrives
chime = yes

# The small button at the bottom right of the screen hides the clock so you can use
# the desktop. It comes back by itself after this many minutes. 0 = only when you
# open PiClock from the desktop icon or the menu.
hide_minutes = 30


[weather]
# Find your coordinates by right-clicking your home in Google Maps.
location_name = Chicago
latitude = 41.88
longitude = -87.63
# fahrenheit or celsius
units = fahrenheit
refresh_minutes = 15


[calendar]
# One or more private iCal (.ics) links. Put each on its own line, indented.
# See README.md for where to find yours in Google, iCloud or Outlook.
# Treat these links like passwords: anyone with one can read that calendar.
#
# urls =
#     https://calendar.google.com/calendar/ical/you%40gmail.com/private-abc123/basic.ics
#     webcal://p01-caldav.icloud.com/published/2/xyz
urls =
days_ahead = 7
refresh_minutes = 10


[claude]
# Show what your Claude Code sessions on the PC are doing (working, done, waiting
# for you). The PC reports them over SSH; README.md explains the one-time setup.
show = yes


[updates]
# Check GitHub every 10 minutes and install any changes you've made there.
# Updates never touch this file. Set to no to update only with: piclock update
auto_update = yes


[email]
# How often to check, and how many of the newest unread messages to show
refresh_minutes = 2
show_latest = 4

# Add one [email:Name] section per mailbox. The name after the colon is shown
# on screen. Use an app password, not your normal password (see README.md).
# Remove the # at the start of each line below to turn it on.
# Gmail shows app passwords with spaces; type them without the spaces.
# Microsoft mail (Outlook, Hotmail, work or school accounts) accepts no password
# from mail apps any more: use the browser extension on the PC instead (README).
# Don't put comments on the same line as a setting; they'd become part of it.
# A password typed here is encrypted (it becomes "enc:...") the next time the
# clock starts. The same happens to calendar links. Or use Settings on the screen.
#
# [email:Personal]
# host = imap.gmail.com
# port = 993
# username = you@gmail.com
# password = abcdefghijklmnop
# folder = INBOX
#
# [email:Work]
# host = imap.fastmail.com
# port = 993
# username = you@example.com
# password = your-app-password
# folder = INBOX
